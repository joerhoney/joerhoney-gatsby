<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebP Converter :j - by Joe Rhoney</title>
    <link rel="icon" href="/favicon-32x32.png" type="image/png" />
    <link
      rel="manifest"
      href="/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <link rel="apple-touch-icon" sizes="48x48" href="/icons/icon-48x48.png" />
    <link rel="apple-touch-icon" sizes="72x72" href="/icons/icon-72x72.png" />
    <link rel="apple-touch-icon" sizes="96x96" href="/icons/icon-96x96.png" />
    <link
      rel="apple-touch-icon"
      sizes="144x144"
      href="/icons/icon-144x144.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="192x192"
      href="/icons/icon-192x192.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="256x256"
      href="/icons/icon-256x256.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="384x384"
      href="/icons/icon-384x384.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="512x512"
      href="/icons/icon-512x512.png"
    />
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        --color-text-primary: #fff;
        --color-text-secondary: #c1c1c1;
        --color-text-tertiary: #9c9c9c;
        --color-text-info: #3b82f6;
        --color-text-danger: #ef4444;
        --color-text-success: #22c55e;
        --color-background-primary: #1f2937;
        --color-background-secondary: #374151;
        --color-background-info: #3b82f6;
        --color-background-danger: #ef4444;
        --color-background-success: #22c55e;
        --color-border-primary: #374151;
        --color-border-secondary: #4b5563;
        --color-border-info: #3b82f6;
        --color-border-danger: #ef4444;
        --color-border-success: #22c55e;
        --border-radius-lg: 0.5rem;
      }

      body {
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: linear-gradient(
          70deg,
          #121f26 30%,
          #302a3f 80%,
          #692938
        );
        padding: 20px;
        min-height: 100vh;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu,
          Cantarell, sans-serif;
      }
      #drop-zone {
        transition:
          background 0.15s,
          border-color 0.15s;
        cursor: pointer;
        border: 2px dashed var(--color-border-secondary);
        border-radius: var(--border-radius-lg);
        background: var(--color-background-secondary);
        padding: 3rem 2rem;
        text-align: center;
      }
      #drop-zone.drag-over {
        border-color: var(--color-border-info);
        background: var(--color-background-info);
      }
      #drop-zone.has-files {
        padding: 1.5rem 2rem;
      }
      .file-row {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 6px 0;
        border: 0.5px solid var(--color-border-tertiary);
        border-radius: var(--border-radius-md);
        background: var(--color-background-primary);
        padding: 8px 12px;
        font-size: 13px;
      }
      .file-name {
        flex: 1;
        overflow: hidden;
        color: var(--color-text-primary);
        text-align: left;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .file-size {
        min-width: 55px;
        color: var(--color-text-secondary);
        text-align: right;
      }
      .file-status {
        min-width: 70px;
        font-size: 12px;
        text-align: right;
      }
      .status-pending {
        color: var(--color-text-tertiary);
      }
      .status-done {
        color: var(--color-text-success);
      }
      .status-error {
        color: var(--color-text-danger);
      }
      .status-working {
        color: var(--color-text-info);
      }
      #convert-btn {
        cursor: pointer;
        margin-top: 1rem;
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        background: var(--color-background-primary);
        padding: 10px 24px;
        width: 100%;
        color: var(--color-text-primary);
        font-weight: 500;
        font-size: 14px;
      }
      #convert-btn:hover {
        background: var(--color-background-secondary);
      }
      #convert-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .quality-row {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 1rem;
      }
      .quality-row label {
        color: var(--color-text-secondary);
        font-size: 13px;
        white-space: nowrap;
      }
      .quality-row input[type="range"] {
        flex: 1;
      }
      .quality-val {
        min-width: 32px;
        color: var(--color-text-primary);
        font-weight: 500;
        font-size: 13px;
      }
      #clear-btn {
        cursor: pointer;
        margin-left: 8px;
        border: none;
        border-radius: var(--border-radius-md);
        background: none;
        padding: 4px 8px;
        color: var(--color-text-secondary);
        font-size: 12px;
      }
      #clear-btn:hover {
        background: var(--color-background-secondary);
      }
      .top-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
      }
      .file-count {
        color: var(--color-text-secondary);
        font-size: 12px;
      }
      .icon {
        display: block;
        margin-bottom: 12px;
        font-size: 32px;
      }
      #file-input {
        display: none;
      }
      .download-all-wrap {
        display: none;
        margin-top: 8px;
      }
      #download-all-btn {
        cursor: pointer;
        border: 0.5px solid var(--color-border-secondary);
        border-radius: var(--border-radius-md);
        background: var(--color-background-primary);
        padding: 10px 24px;
        width: 100%;
        color: var(--color-text-success);
        font-weight: 500;
        font-size: 14px;
      }
      #download-all-btn:hover {
        background: var(--color-background-secondary);
      }
    </style>
  </head>
  <body>
    <div style="padding: 1rem 0; max-width: 560px; margin: 0 auto">
      <div class="quality-row">
        <label>Quality</label>
        <input
          type="range"
          min="1"
          max="100"
          value="80"
          id="quality-slider"
          step="1"
        />
        <span class="quality-val" id="quality-val">80%</span>
      </div>

      <div id="drop-zone">
        <span class="icon">🖼️</span>
        <p
          style="
            font-size: 15px;
            font-weight: 500;
            margin: 0 0 6px;
            color: var(--color-text-primary);
          "
        >
          Drop images here
        </p>
        <p
          style="
            font-size: 13px;
            color: var(--color-text-secondary);
            margin: 0 0 16px;
          "
        >
          or click to browse — JPG, PNG, GIF, BMP, TIFF, AVIF and more
        </p>
        <button
          onclick="document.getElementById('file-input').click()"
          style="
            padding: 8px 20px;
            font-size: 13px;
            background: var(--color-background-primary);
            border: 0.5px solid var(--color-border-secondary);
            border-radius: var(--border-radius-md);
            cursor: pointer;
            color: var(--color-text-primary);
          "
        >
          Browse files
        </button>
      </div>
      <input type="file" id="file-input" multiple accept="image/*" />

      <div id="file-list" style="margin-top: 12px"></div>
      <button id="convert-btn" style="display: none" onclick="convertAll()">
        Convert to WebP
      </button>
      <div class="download-all-wrap" id="download-all-wrap">
        <button id="download-all-btn" onclick="downloadAll()">
          Download all as ZIP
        </button>
      </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script>
      const files = [];
      const blobs = {};

      const dropZone = document.getElementById("drop-zone");
      const fileList = document.getElementById("file-list");
      const convertBtn = document.getElementById("convert-btn");
      const qualitySlider = document.getElementById("quality-slider");
      const qualityVal = document.getElementById("quality-val");
      const downloadAllWrap = document.getElementById("download-all-wrap");

      qualitySlider.addEventListener("input", () => {
        qualityVal.textContent = qualitySlider.value + "%";
      });

      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("drag-over");
      });
      dropZone.addEventListener("dragleave", () =>
        dropZone.classList.remove("drag-over"),
      );
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("drag-over");
        addFiles([...e.dataTransfer.files]);
      });
      dropZone.addEventListener("click", (e) => {
        if (e.target.tagName !== "BUTTON")
          document.getElementById("file-input").click();
      });
      document
        .getElementById("file-input")
        .addEventListener("change", (e) => addFiles([...e.target.files]));

      function addFiles(newFiles) {
        newFiles
          .filter((f) => f.type.startsWith("image/"))
          .forEach((f) => files.push(f));
        renderList();
        convertBtn.style.display = files.length ? "block" : "none";
        downloadAllWrap.style.display = "none";
        Object.keys(blobs).forEach((k) => delete blobs[k]);
      }

      function fmtSize(bytes) {
        if (bytes < 1024) return bytes + " B";
        if (bytes < 1048576) return (bytes / 1024).toFixed(0) + " KB";
        return (bytes / 1048576).toFixed(1) + " MB";
      }

      function renderList(statuses) {
        if (!files.length) {
          fileList.innerHTML = "";
          return;
        }
        const topBar = `<div class="top-bar"><span class="file-count">${files.length} image${files.length > 1 ? "s" : ""} queued</span><button id="clear-btn" onclick="clearFiles()">Clear all</button></div>`;
        const rows = files
          .map((f, i) => {
            const s = statuses ? statuses[i] : "pending";
            let statusHtml = "";
            if (s === "pending")
              statusHtml =
                '<span class="file-status status-pending">pending</span>';
            else if (s === "working")
              statusHtml =
                '<span class="file-status status-working">converting…</span>';
            else if (s === "done")
              statusHtml = `<span class="file-status status-done" style="cursor:pointer;" onclick="downloadOne(${i})">download</span>`;
            else
              statusHtml =
                '<span class="file-status status-error">error</span>';
            return `<div class="file-row"><span class="file-name">${f.name}</span><span class="file-size">${fmtSize(f.size)}</span>${statusHtml}</div>`;
          })
          .join("");
        fileList.innerHTML = topBar + rows;
      }

      function clearFiles() {
        files.length = 0;
        Object.keys(blobs).forEach((k) => delete blobs[k]);
        fileList.innerHTML = "";
        convertBtn.style.display = "none";
        downloadAllWrap.style.display = "none";
        document.getElementById("file-input").value = "";
      }

      async function convertAll() {
        const quality = parseInt(qualitySlider.value) / 100;
        const statuses = files.map(() => "pending");
        convertBtn.disabled = true;
        downloadAllWrap.style.display = "none";

        for (let i = 0; i < files.length; i++) {
          statuses[i] = "working";
          renderList([...statuses]);
          try {
            const blob = await toWebP(files[i], quality);
            blobs[i] = blob;
            statuses[i] = "done";
          } catch (e) {
            statuses[i] = "error";
          }
          renderList([...statuses]);
        }

        convertBtn.disabled = false;
        const anyDone = statuses.some((s) => s === "done");
        if (anyDone && files.length > 1)
          downloadAllWrap.style.display = "block";
      }

      function toWebP(file, quality) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth;
            canvas.height = img.naturalHeight;
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0);
            URL.revokeObjectURL(url);
            canvas.toBlob(
              (blob) => {
                if (blob) resolve(blob);
                else reject(new Error("conversion failed"));
              },
              "image/webp",
              quality,
            );
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error("load failed"));
          };
          img.src = url;
        });
      }

      function baseName(name) {
        return name.replace(/\.[^.]+$/, "");
      }

      function downloadOne(i) {
        const blob = blobs[i];
        if (!blob) return;
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = baseName(files[i].name) + ".webp";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }

      async function downloadAll() {
        const zip = new JSZip();
        for (let i = 0; i < files.length; i++) {
          if (blobs[i]) {
            zip.file(baseName(files[i].name) + ".webp", blobs[i]);
          }
        }
        const zipBlob = await zip.generateAsync({ type: "blob" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(zipBlob);
        a.download = "webp-images.zip";
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      }
    </script>
  </body>
</html>
