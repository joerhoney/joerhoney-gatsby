<!DOCTYPE html>
<html lang="en" class="no-js">
  <head>
    <title>Calculators</title>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0"
    />
    <link href="ui.css" rel="stylesheet" />
  </head>
  <body>
    <h1>Calculators</h1>
    <section>
      <div class="accordion">
        <div class="open">
          <h3 class="toggler tab">Pay</h3>
          <div class="contents">
            <fieldset id="payCalculator">
              <label for="yearlyRate">Yearly $</label>
              <input id="yearlyRate" type="number" /><br />
              <label for="monthlyRate">Monthly $</label>
              <input id="monthlyRate" type="number" /><br />
              <label for="biWeeklyRate">Bi-Weekly $</label>
              <input id="biWeeklyRate" type="number" /><br />
              <label for="weeklyRate">Weekly $</label>
              <input id="weeklyRate" type="number" /><br />
              <label for="dailyRate">Daily $</label>
              <input id="dailyRate" type="number" /><br />
              <label for="hourlyRate">Hourly $</label>
              <input id="hourlyRate" type="number" />
            </fieldset>
            <script type="text/javascript">
              const rates = {
                yearly: document.getElementById("yearlyRate"),
                monthly: document.getElementById("monthlyRate"),
                biWeekly: document.getElementById("biWeeklyRate"),
                weekly: document.getElementById("weeklyRate"),
                daily: document.getElementById("dailyRate"),
                hourly: document.getElementById("hourlyRate"),
              };

              const conversionFactors = {
                yearly: {
                  monthly: 1 / 12,
                  biWeekly: 1 / 26,
                  weekly: 1 / 52,
                  daily: 1 / 260,
                  hourly: 1 / 2080,
                },
                monthly: {
                  yearly: 12.000216,
                  biWeekly: 1 / 2.1666667,
                  weekly: 1 / 4.333333,
                  daily: 1 / 21.666667,
                  hourly: 1 / 173.333333,
                },
                biWeekly: {
                  yearly: 26,
                  monthly: 2.1666667,
                  weekly: 1 / 2,
                  daily: 1 / 10,
                  hourly: 1 / 80,
                },
                weekly: {
                  yearly: 52,
                  monthly: 4.333333,
                  biWeekly: 2,
                  daily: 1 / 5,
                  hourly: 1 / 40,
                },
                daily: {
                  yearly: 260,
                  monthly: 21.666667,
                  biWeekly: 10,
                  weekly: 5,
                  hourly: 1 / 8,
                },
                hourly: {
                  yearly: 2080,
                  monthly: 2080 / 12,
                  biWeekly: 80,
                  weekly: 40,
                  daily: 8,
                },
              };

              function updateRates(source) {
                const sourceKey = Object.keys(rates).find(
                  (key) => rates[key] === source
                );
                const sourceValue = parseFloat(source.value) || 0;

                Object.keys(conversionFactors[sourceKey]).forEach(
                  (targetKey) => {
                    rates[targetKey].value = (
                      sourceValue * conversionFactors[sourceKey][targetKey]
                    ).toFixed(2);
                  }
                );
              }

              Object.values(rates).forEach((input) => {
                input.addEventListener("input", (event) =>
                  updateRates(event.target)
                );
              });
            </script>
          </div>
        </div>
        <div>
          <h3 class="toggler tab">Leap Year</h3>
          <div class="contents">
            <div id="aboutYear" class="height2line">
              Please enter a year to check if it is a leap year.
            </div>
            <fieldset>
              <label for="checkYear">Check Year</label>
              <input id="checkYear" type="number" />
            </fieldset>
            <p>
              <strong>Note:</strong> Results are based on the common
              <a
                href="https://en.wikipedia.org/wiki/Gregorian_calendar"
                target="_blank"
                >Gregorian calendar</a
              >
              which wasn't in use until 1582.
            </p>
            <script type="text/javascript">
              const aboutYear = document.getElementById("aboutYear");
              const startmsg =
                "Please enter a year to check if it is a leap year.";
              // (function() {aboutYear.innerHTML = startmsg;})();
              const date = new Date();
              const currentYear = date.getFullYear();
              function checkLeapYear(check) {
                // val: accepts a decimal value
                // state: accepts "not" or "leap"
                function leapmsg(val, state) {
                  let tense = "",
                    century = "";
                  if (val > currentYear) {
                    if (state === "not") tense = " will not be a ";
                    else tense = " will be a ";
                  } else if (val < currentYear) {
                    if (state === "not") tense = " was not a ";
                    else tense = " was a ";
                  } else if (val === currentYear) {
                    if (state === "not") tense = " is not a ";
                    else tense = " is a ";
                  }
                  if ((val / 100) % 1 == 0 && !(state === "not")) {
                    century = "century ";
                  } else {
                    century = "";
                  }
                  return val + tense + century + "leap year.";
                }
                check.addEventListener("keyup" || "paste", function () {
                  if (check.value === "") {
                    aboutYear.innerHTML = startmsg;
                  } else {
                    // One of every 4th year?
                    if ((check.value / 4) % 1 != 0) {
                      aboutYear.innerHTML = leapmsg(check.value, "not");
                    } else {
                      // Century year?
                      if ((check.value / 100) % 1 != 0) {
                        aboutYear.innerHTML = leapmsg(check.value, "leap");
                      } else {
                        // One of every 400 century years?
                        if ((check.value / 400) % 1 != 0) {
                          aboutYear.innerHTML = leapmsg(check.value, "not");
                        } else {
                          aboutYear.innerHTML = leapmsg(check.value, "leap");
                        }
                      }
                    }
                  }
                });
              }
              checkLeapYear(checkYear);
            </script>
          </div>
        </div>
        <div>
          <h3 class="toggler tab">Character Count</h3>
          <div class="contents">
            <fieldset>
              <div id="characterCount" class="huge">0</div>
              <textarea id="characters" rows="8" cols="80"></textarea>
            </fieldset>
            <script type="text/javascript">
              // alert("You have typed " + typed.length + " characters. You have " + (180 - typed.length) + " characters remaining.");
              const characters = document.getElementById("characters");
              const characterCount = document.getElementById("characterCount");
              function countCharacters(chars, count) {
                chars.addEventListener("keyup", function () {
                  count.innerHTML = chars.value.length;
                });
                chars.addEventListener(
                  "paste",
                  function () {
                    window.setTimeout(function () {
                      count.innerHTML = chars.value.length;
                    }, 200);
                  },
                  false
                );
              }
              countCharacters(characters, characterCount);
            </script>
          </div>
        </div>
      </div>
    </section>
    <script src="ui.js?v=0>"></script>
  </body>
</html>
